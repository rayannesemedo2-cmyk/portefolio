<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Entr em contacto com a Ressureição Moreno para proposta de estágio, projetos de desenvolvimento web ou esclarecimento de dúvidas"
    />
    <meta name="author" content="Ressureição Moreno" />
    <meta name="viewport" content="width=device-widyh, initial-scale=1.0" />
    <title>Portefolio|Contacto</title>
  </head>
  <body>
    <header>
      <h1>Meu Contacto</h1>

      <nav>
        <ul>
          <li><a href="index.html">inicio</a></li>
          <li><a href="sobre.html">sobre</a></li>
          <li><a href="contacto.html">contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="fomulario-contacto">
        <h2>Enviar uma mensagem</h2>
        <p>
          Se preferir, pode enviar uma mensagem diretamente através do
          formulário abaixo.
        </p>
        <form action="#" method="GET">
          <fieldset>
            <legend>Informações Pessoais</legend>
            <div>
              <label for="nome">Nome</label><br>
              <input
              type="text"
              name="nome"
              id="nome"
              placeholder="Insera o seu nome"
              required/>
            </div><br>

            <div>
              <label for="email">Email</label><br>
              <input
              type="email"
              name="email"
              id="email"
              placeholder="Insera o seu email"
              required/>
            </div><br>

            <div>
              <label for="telefone">Telefone(Opcional)</label><br>
              <input
              type="tel"
              name="telefone"
              id="felefone"
              placeholder="(+238)000 00 00"/>
            </div><br>

          </fieldset>

          <fieldset>
            <legend>Motivos de Contacto</legend><br>
            <div>
            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto" requider>
              <option value="">--Selecione uma opção</option>
              <option value="proposta de estagio">Proposta de Estágio</optiion>
              <option value="projetos ou colaboracoes">Projetos ou Colaborações</option>
              <opcion value="duvidas ou esclarecimento">Duvidas ou Esclarecimento</opcion>
            </select>
            </div><br>

            <div>
              <label for="mensagem">Mensagem</label><br>
              <textarea
              id="mensagem"
              name="mensagem"
              placeholder="Sua Mensagem"
              row="10"
              cols="20"
              required
              maxlength="255">
             </textarea>
            </div>

          <div>
            <label for="resposta">Como preferes receber a resposta?</label><br>
            <input
            type="radio"
            id="telefone"
            name="resposta"
            value="telefone"
            checked/>

            <label for="telefone">Telefone</label><br>

            <input
            type="radio"
            id="email"
            name="resposta"
            value="email"/>

            <label for="email">Email</label>


            <div>
              <label for="autorizacao">Autorização</label>

              <input
              type="checkbox"
              value="sim"
              id="autorizacao"
              name="autorizacao"/><br>

              <label>Autoriza a utilização dos  meus dados e aceito os termos de uso da plataforma!</label>

            </div>

          </div>
          </fieldset>
          <div>
          <button type="submit">Enviar</button>
          <button type="reset">Limpar</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
